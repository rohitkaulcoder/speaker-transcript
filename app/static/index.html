<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Speaker Transcript</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #171a21;
      --border: #2a2f3a;
      --text: #e6e8ee;
      --muted: #9aa3b2;
      --accent: #4f8cff;
      --accent-dark: #3a6fd6;
      --ok: #3ecf8e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.55;
    }
    header {
      max-width: 760px;
      margin: 0 auto;
      padding: 28px 20px 8px;
    }
    header h1 { font-size: 22px; margin: 0 0 4px; }
    header p { color: var(--muted); margin: 0; font-size: 14px; }
    main { max-width: 760px; margin: 0 auto; padding: 16px 20px 60px; }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 16px;
    }
    .tabs { display: flex; gap: 8px; margin-bottom: 14px; }
    .tab {
      flex: 1;
      padding: 9px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 14px;
    }
    .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .pane { display: none; }
    .pane.active { display: block; }
    input[type="url"], input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #0f1115;
      color: var(--text);
      font-size: 14px;
      margin-bottom: 10px;
    }
    .row { display: flex; gap: 10px; margin-bottom: 10px; }
    .row input { margin-bottom: 0; }
    .btn {
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn:hover { background: var(--accent-dark); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .drop {
      border: 2px dashed var(--border);
      border-radius: 10px;
      padding: 34px 18px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      cursor: pointer;
      transition: border-color 0.15s;
    }
    .drop.over { border-color: var(--accent); }
    .drop small { display: block; margin-top: 6px; color: #6b7482; }
    #status { color: var(--muted); font-size: 14px; margin-bottom: 12px; }
    .spinner {
      display: inline-block;
      width: 12px; height: 12px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      margin-right: 8px;
      animation: spin 0.8s linear infinite;
      vertical-align: -1px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .utterance {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
      align-items: flex-start;
    }
    .speaker {
      min-width: 30px;
      height: 30px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 13px;
      color: #fff;
      flex-shrink: 0;
    }
    .txt { padding-top: 4px; }
    .meta { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; }
    .meta .btn { padding: 8px 14px; font-size: 13px; }
    .sp-base { background: #4f8cff; }
    .sp-b { background: #e0694f; }
    .sp-c { background: #3ecf8e; }
    .sp-d { background: #d8a53f; }
    .sp-e { background: #9b6df2; }
    .sp-f { background: #2fb6c9; }
    .sp-g { background: #e0538b; }
    .sp-h { background: #7f9a4f; }
    .unknown { color: var(--muted); }
    .error { color: #ff6b6b; }
    #out.hidden { display: none; }
    #file-name { font-size: 13px; color: #6b7482; margin-top: 8px; }
  </style>
</head>
<body>
  <header>
    <h1>Speaker Transcript</h1>
    <p>Paste a YouTube URL or upload an mp3/mp4. Get a speaker-labelled transcript.</p>
  </header>
  <main>
    <div class="card">
      <div class="tabs">
        <button class="tab active" data-tab="url">YouTube URL</button>
        <button class="tab" data-tab="upload">Upload file</button>
      </div>

      <div id="pane-url" class="pane active">
        <input type="url" id="yt-url" placeholder="https://www.youtube.com/watch?v=..." />
        <div class="row">
          <input type="text" id="url-speakers" placeholder="Speakers expected (optional, e.g. 2)" />
          <button class="btn" id="url-go">Transcribe</button>
        </div>
      </div>

      <div id="pane-upload" class="pane">
        <div class="drop" id="drop">Drop a video or audio file here, or click to browse
          <small>mp3, mp4, m4a/m4v, wav, webm, mov, ogg, flac, aac, m4b &amp; more — up to 2 GB</small>
        </div>
        <input type="file" id="file-input" accept="audio/*,video/*,.mp3,.mp4,.m4v,.m4a,.wav,.webm,.mov,.ogg,.flac,.aac,.m4b,.ts,.mts,.op" hidden />
        <div id="file-name"></div>
      </div>

      <div id="status" style="margin-top:14px"></div>
    </div>

    <div class="card" id="out">
      <div class="meta">
        <span id="out-title">Transcript</span>
      </div>
      <div id="transcript"></div>
    </div>
  </main>

  <script>
    const PALETTE = ["sp-base", "sp-b", "sp-c", "sp-d", "sp-e", "sp-f", "sp-g", "sp-h"];
    const $ = (id) => document.getElementById(id);
    const tabs = document.querySelectorAll(".tab");
    const statusEl = $("status");
    const spinner = '<span class="spinner"></span>';

    tabs.forEach((tab) => {
      tab.addEventListener("click", () => {
        tabs.forEach((t) => t.classList.toggle("active", t === tab));
        $("pane-url").classList.toggle("active", tab.dataset.tab === "url");
        $("pane-upload").classList.toggle("active", tab.dataset.tab === "upload");
        flushStatus();
      });
    });

    $("url-go").addEventListener("click", startFromUrl);
    $("yt-url").addEventListener("keydown", (e) => { if (e.key === "Enter") startFromUrl(); });

    const drop = $("drop");
    drop.addEventListener("click", () => $("file-input").click());
    drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("over"); });
    drop.addEventListener("dragleave", () => drop.classList.remove("over"));
    drop.addEventListener("drop", (e) => {
      e.preventDefault();
      drop.classList.remove("over");
      if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
    });
    $("file-input").addEventListener("change", (e) => {
      if (e.target.files[0]) handleFile(e.target.files[0]);
    });

    async function startFromUrl() {
      const url = $("yt-url").value.trim();
      if (!url) return setStatus("Paste a YouTube URL first.", true);
      setBusy("Downloading audio, then transcribing…");
      try {
        const res = await fetch("/api/transcribe/url", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            url: url,
            speakers_expected: parseInt($("url-speakers").value, 10) || null,
          }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || data.error || "Request failed");
        $("out").classList.add("hidden");
        poll(data.transcript_id);
      } catch (err) {
        setStatus("Error: " + err.message, true);
      }
    }

    function handleFile(file) {
      const bad = !/\.(3ga|8svx|aac|ac3|aif|aiff|alac|amr|ape|au|dss|flac|flv|m4a|m4b|m4p|m4r|mp3|mpga|ogg|oga|mogg|opus|qcp|tta|voc|wav|wma|wv|webm|mts|m2ts|ts|mov|mp2|mp4|m4v|mxf)$/i.test(file.name);
      if (bad) return setStatus("Unsupported file type.", true);
      $("file-name").textContent = `${file.name} (${(file.size / 1e6).toFixed(1)} MB)`;
      setBusy("Uploading…");
      const form = new FormData();
      form.append("file", file);
      fetch("/api/transcribe/upload", { method: "POST", body: form })
        .then((res) => res.json().then((d) => ({ res, d })))
        .then(({ res, d }) => {
          if (!res.ok) throw new Error(d.detail || d.error || "Upload failed");
          $("out").classList.add("hidden");
          poll(d.transcript_id);
        })
        .catch((err) => setStatus("Error: " + err.message, true));
    }

    async function poll(id) {
      const started = Date.now();
      const tick = async () => {
        try {
          const res = await fetch(`/api/transcript/${id}`);
          const data = await res.json();
          if (!res.ok) throw new Error(data.detail || "Polling failed");

          if (data.status === "completed") {
            render(data);
            setStatus(`Done in ${((Date.now() - started) / 1000).toFixed(1)}s`);
            fetch(`/api/transcript/${id}`, { method: "DELETE" });
            return;
          }
          if (data.status === "error") { setStatus("Transcription failed.", true); return; }
          setBusy("Transcribing…");
          setTimeout(tick, 2500);
        } catch (err) {
          setStatus("Error: " + err.message, true);
        }
      };
      tick();
    }

    function render(data) {
      const box = $("transcript");
      box.innerHTML = "";
      const speakerIdx = new Map();
      let next = 0;
      const color = (id) => {
        if (!speakerIdx.has(id)) speakerIdx.set(id, PALETTE[next++ % PALETTE.length]);
        return speakerIdx.get(id);
      };

      (data.utterances || []).forEach((u) => {
        const div = document.createElement("div");
        div.className = "utterance";
        const sp = document.createElement("div");
        sp.className = "speaker " + color(u.speaker);
        sp.textContent = u.speaker;
        const txt = document.createElement("div");
        txt.className = "txt";
        txt.textContent = u.text;
        div.append(sp, txt);
        box.appendChild(div);
      });
      if (!box.children.length) {
        box.innerHTML = '<div class="unknown">No speech detected.</div>';
      }
      $("out").classList.remove("hidden");
    }

    function setStatus(msg, isError) {
      clearBusy();
      statusEl.innerHTML = msg;
      statusEl.className = isError ? "error" : "";
    }
    function setBusy(msg) {
      statusEl.innerHTML = spinner + msg;
      statusEl.className = "";
    }
    function clearBusy() { statusEl.innerHTML = ""; }
    function flushStatus() { }
  </script>
</body>
</html>
